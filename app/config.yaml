manifest:
  # --- Agents ---

  platform-builder:
    description: "Creates agents, teams, workflows, and schedules using the AgentOS Studio."
    quick_prompts:
      - "What can you build for me?"
      - "Build an agent that tracks AI news and writes a daily brief"
      - "Build a daily pulse workflow and schedule it for 9am"

  platform-manager:
    description: "Monitors and explains what this AgentOS is doing: usage patterns, run activity, deployment checks."
    quick_prompts:
      - "How healthy is the platform right now?"
      - "Share some usage patterns"
      - "Which agent is slowest, and is anything failing?"

  platform-engineer:
    description: "Knows how this AgentOS is built: reads the source and explains the wiring, grounded in real files."
    quick_prompts:
      - "Tell me about this AgentOS"
      - "How is the MCP endpoint wired?"
      - "Which env vars does this platform read?"

  # --- Teams ---

  agno:
    description: "This platform, speaking for itself. Tell Agno anything; it builds agents, runs what the team has built, and checks on itself."
    quick_prompts:
      - "What's up Agno?"
      - "Agno, we're getting zapatos from garaje"
      - "Agno, how are you doing?"

  # --- Workflows ---

  deployment-check:
    description: "Run a deployment check to verify the AgentOS is running correctly."
    quick_prompts:
      - "Run the deployment check"

  run-evals:
    description: "Run a subset of the eval suite."
    quick_prompts:
      - "Run the smoke evals"
