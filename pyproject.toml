[project]
name = "agentos"
version = "1.0.0"
description = "AgentOS: a production runtime for agents."
requires-python = ">=3.14,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  # csv/excel/docx/pdf/website are agno's reader extras: aiofiles, openpyxl+xlrd,
  # python-docx, pypdf, beautifulsoup4. Without them the Knowledge page can ingest
  # only .txt, .md and .json. Named individually rather than via agno[knowledge],
  # which also pulls chonkie (huggingface-hub, tokenizers, safetensors, model2vec,
  # tree-sitter) for semantic and code chunking that no reader here uses.
  # agno[knowledge-full] adds docling and OCR on top -- a deep-learning stack.
  "agno[os,mcp,slack,pgvector,psycopg,csv,excel,docx,pdf,website]==3.0.0a5",
  "cel-python",
  "openai",
  "parallel-web",
  "python-dotenv",
  "reportlab",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "evals*", "teams*", "workflows*"]
namespaces = false

[tool.ruff]
line-length = 120
exclude = [".venv*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
# tmp/ is untracked scratch space — never part of the validated tree.
exclude = [".venv*", "tmp"]
