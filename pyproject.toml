[project]
name = "agentos"
version = "1.0.0"
description = "AgentOS: a production runtime for agents."
requires-python = ">=3.14,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  # csv/excel/docx are agno's own reader extras: aiofiles, openpyxl+xlrd, python-docx.
  # Without them the Knowledge page advertises formats it cannot actually ingest.
  "agno[os,mcp,slack,pgvector,psycopg,csv,excel,docx]==3.0.0a4",
  "beautifulsoup4",  # website + llms_txt readers; no agno extra provides it
  "cel-python",
  "openai",
  "parallel-web",
  # pypdf direct, not agno[pdf] — that extra also pulls rapidocr_onnxruntime for
  # scanned-PDF OCR, which is a large dependency this template has no use for.
  "pypdf",
  "python-dotenv",
  "reportlab",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "evals*", "teams*", "workflows*"]
namespaces = false

[tool.ruff]
line-length = 120
exclude = [".venv*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
# tmp/ is untracked scratch space — never part of the validated tree.
exclude = [".venv*", "tmp"]
